name: test-and-evaluate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PDF renderer and OCR test font
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Evaluate offline agent
        run: python -m evals.evaluate --min-task-success 1.0
