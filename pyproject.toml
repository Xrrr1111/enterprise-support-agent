[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-support-agent"
version = "1.0.0"
description = "Inspectable enterprise support agent with tools, local RAG, reliability harness, traces, tests, and evals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Enterprise Support Agent Contributors"}]
dependencies = [
  "pypdf>=5.0,<7.0",
  "Pillow>=10.0,<13.0",
  "rapidocr-onnxruntime>=1.3,<2.0",
  "tokenizers>=0.20,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
enterprise-support-agent = "enterprise_support_agent.cli:main"
enterprise-support-web = "enterprise_support_agent.web:main"

[tool.setuptools.packages.find]
include = ["enterprise_support_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
